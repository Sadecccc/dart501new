<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Dart 501 Online</title>
<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background:#0f172a;
  color:white;
  text-align:center;
}
h1 {margin:10px;}
input {padding:10px; margin:5px; border-radius:8px; border:none; font-size:16px;}
button {border:none; border-radius:12px; padding:12px; font-size:16px; margin:4px; background:#1e293b; color:white; cursor:pointer;}
button:active {background:#334155;}
.active {background:#22c55e !important;}
#numbers {display:grid; grid-template-columns: repeat(5,1fr); margin:10px auto; max-width:400px;}
#multipliers button {width:30%;}
.card {background:#1e293b; padding:10px; border-radius:12px; margin-bottom:10px;}
#gameArea {padding:15px; display:none;}
#overlay {position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:none; justify-content:center; align-items:center;}
.overlay-content {background:#1e1e1e; padding:20px; border-radius:15px; max-width:400px;}
.player-stats {display:flex; justify-content:space-between; margin-bottom:10px;}
.stats {background:#1e293b; padding:10px; border-radius:10px; width:48%; text-align:left;}
.stats h3 {margin:0 0 5px 0;}
.last-throws p {margin:2px 0;}
.last-throws .last {font-weight:bold;}
</style>
</head>
<body>

<h1>Dart 501 Online</h1>

<div class="card" id="setup">
  <input id="name" placeholder="Dein Name">
  <input type="number" id="setsToWin" placeholder="Sets zum Sieg" value="3">
  <input type="number" id="legsToWin" placeholder="Legs zum Sieg" value="5">
  <button onclick="createGame()">Spiel erstellen</button>
  <input id="gameIdInput" placeholder="Game ID">
  <button onclick="joinGame()">Beitreten</button>
  <h3 id="link"></h3>
</div>

<div id="gameArea">
  <div class="player-stats" id="playerStats"></div>

  <div class="card" id="multipliers">
    <button onclick="setMultiplier(1)" id="m1" class="active">Single</button>
    <button onclick="setMultiplier(2)" id="m2">Double</button>
    <button onclick="setMultiplier(3)" id="m3">Triple</button>
  </div>

  <div class="card">
    <h3>Zahlen</h3>
    <div id="numbers"></div>
  </div>

  <div class="card">
    <h3>Letzte 5 Würfe</h3>
    <div class="last-throws" id="lastThrows"></div>
  </div>

  <div class="card">
    <h3>Aktueller Wurf</h3>
    <p id="throws"></p>
    <button onclick="undo()">Undo</button>
    <button onclick="submitTurn()">Zug beenden</button>
  </div>
</div>

<div id="overlay" class="overlay">
  <div class="overlay-content">
    <h2>Spiel beendet</h2>
    <p id="winnerText"></p>
    <button onclick="closeOverlay()">Schließen</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
let gameId;
let currentThrows = [];
let multiplier = 1;
let totalPoints = {}; // PlayerID -> total points for Average
let totalDarts = {};  // PlayerID -> darts thrown for Average
let lastThrows = {};  // PlayerID -> array of last 5 throws
let players = [];
let playerScores = {}; // playerId -> current score
let setsToWin = 3;
let legsToWin = 5;

const socket = io();

// ---------------------------
// Setup Zahlen Buttons
const numbersDiv = document.getElementById("numbers");
for(let i=1;i<=20;i++){
  const btn=document.createElement("button");
  btn.innerText=i;
  btn.onclick=()=>addThrow(i);
  numbersDiv.appendChild(btn);
}
const bull=document.createElement("button");
bull.innerText="25";
bull.onclick=()=>addThrow(25);
numbersDiv.appendChild(bull);

// ---------------------------
// Spielerstatistiken anzeigen
function updatePlayerStats(){
  const container=document.getElementById("playerStats");
  container.innerHTML="";
  players.forEach((p,i)=>{
    const div=document.createElement("div");
    div.className="stats";
    let avg=(totalDarts[p.id]? (totalPoints[p.id]/totalDarts[p.id]*3).toFixed(2) : "0.00");
    let last=lastThrows[p.id]||[];
    let lastHTML=last.map((v,idx)=>(idx===last.length-1? `<p class="last">${v}</p>`:`<p>${v}</p>`)).join("");
    div.innerHTML=`<h3>${p.name}</h3>
      <p>Score: ${playerScores[p.id]||501}</p>
      <p>Average: ${avg}</p>
      <div class="last-throws">${lastHTML}</div>`;
    container.appendChild(div);
  });
}

// ---------------------------
// Darts hinzufügen
function addThrow(value){
  if(currentThrows.length>=3) return;
  const currentPlayer=players.find(p=>p.id===gameId); // einfacher Platzhalter
  let points=value*multiplier;
  if(value===25 && multiplier===2) points=50;

  const remaining=playerScores[currentPlayer.id]||501;

  // Check Überwurf oder Checkout
  if(points>remaining || (remaining-points===1)){
    currentThrows.push({value,multiplier,points:"Bust"});
    endTurn(); // sofort nächster Spieler
    return;
  }

  currentThrows.push({value,multiplier,points});
  updateThrows();

  // Auto Single zurücksetzen
  setMultiplier(1);

  // Auto Ende nach 3 Darts
  if(currentThrows.length===3) setTimeout(()=>submitTurn(),500);
}

// ---------------------------
function submitTurn(){
  const total=currentThrows.reduce((s,t)=>typeof t.points==="number"? s+t.points:s,0);
  const last=currentThrows[currentThrows.length-1];
  const currentPlayer=players.find(p=>p.id===gameId);

  playerScores[currentPlayer.id]-=total;
  if(!totalPoints[currentPlayer.id]) totalPoints[currentPlayer.id]=0;
  totalPoints[currentPlayer.id]+=total;
  if(!totalDarts[currentPlayer.id]) totalDarts[currentPlayer.id]=0;
  totalDarts[currentPlayer.id]+=currentThrows.filter(t=>typeof t.points==="number").length;

  if(!lastThrows[currentPlayer.id]) lastThrows[currentPlayer.id]=[];
  lastThrows[currentPlayer.id].push(...currentThrows.map(t=>typeof t.points==="number"?t.points:"Bust"));
  if(lastThrows[currentPlayer.id].length>5) lastThrows[currentPlayer.id]=lastThrows[currentPlayer.id].slice(-5);

  updateThrows();
  updatePlayerStats();

  socket.emit("throw",{gameId,points:total});
  currentThrows=[];
}

// ---------------------------
function endTurn(){
  currentThrows=[];
  updateThrows();
  // TODO: Socket Event für nächsten Spieler senden
}

// ---------------------------
function updateThrows(){
  document.getElementById("throws").innerText=currentThrows.map(t=>`${t.value}x${t.multiplier} (${t.points})`).join(", ");
}

// ---------------------------
function undo(){currentThrows.pop(); updateThrows();}
function setMultiplier(m){multiplier=m; document.querySelectorAll("#m1,#m2,#m3").forEach(b=>b.classList.remove("active")); document.getElementById("m"+m).classList.add("active");}

// ---------------------------
function createGame(){
  const name=document.getElementById("name").value;
  setsToWin=parseInt(document.getElementById("setsToWin").value)||3;
  legsToWin=parseInt(document.getElementById("legsToWin").value)||5;
  if(!name){alert("Bitte Namen eingeben!"); return;}
  socket.emit("createGame",{name,setsToWin,legsToWin});
}

// ---------------------------
function joinGame(){
  const name=document.getElementById("name").value;
  gameId=document.getElementById("gameIdInput").value;
  socket.emit("joinGame",{gameId,name});
  document.getElementById("gameArea").style.display="block";
}

// ---------------------------
socket.on("gameCreated",id=>{
  gameId=id;
  document.getElementById("link").innerText=window.location.origin+"?game="+id;
  document.getElementById("gameArea").style.display="block";
});

socket.on("gameUpdate",game=>{
  players=game.players;
  playerScores={};
  players.forEach(p=>playerScores[p.id]=game.scores[p.id]);
  updatePlayerStats();
});

socket.on("gameOver",({winner})=>{
  document.getElementById("winnerText").innerText=winner||"Unentschieden";
  document.getElementById("overlay").style.display="flex";
});

function closeOverlay(){document.getElementById("overlay").style.display="none";}
</script>

</body>
</html>
