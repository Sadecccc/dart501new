<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Dart 501 Online</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
  text-align: center;
}
h1 { margin-top: 10px; }
input { padding: 10px; margin: 5px; border-radius: 8px; border: none; font-size: 16px; }
button { border: none; border-radius: 12px; padding: 15px; font-size: 16px; margin: 4px; background: #1e293b; color: white; cursor: pointer; }
button:active { background: #334155; }
.active { background: #22c55e !important; }
#numbers { display: grid; grid-template-columns: repeat(5, 1fr); margin: 10px auto; max-width: 400px; }
#multipliers button { width: 30%; }
.card { background: #1e293b; padding: 10px; border-radius: 12px; margin-bottom: 10px; }
#gameArea { padding: 15px; display: none; }
#overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; }
.overlay-content { background: #1e1e1e; padding: 20px; border-radius: 15px; max-width:400px; }
.player-stats { display: flex; justify-content: space-between; margin-bottom:10px; }
.stats { background:#1e293b; padding:10px; border-radius:10px; width:48%; text-align:left; }
.stats h3 { margin:0 0 5px 0; }
.last-throws p { margin:2px 0; }
.last-throws .last { font-weight:bold; }
.checkout { margin-top:10px; font-size:14px; color:#22c55e; }
.set-leg-display { margin-top:5px; font-size:14px; color:#a5b4fc; }
.score { font-size:35px; font-weight:bold; color:#facc15; margin:5px 0; }
</style>
</head>
<body>

<h1>Dart 501 Online</h1>

<div class="card" id="setup">
  <input id="name" placeholder="Dein Name">
  <div>
    <label for="setsToWin">Sets zum Sieg:</label>
    <input type="number" id="setsToWin" value="3" min="1">
  </div>
  <div>
    <label for="legsToWin">Legs zum Sieg:</label>
    <input type="number" id="legsToWin" value="5" min="1">
  </div>
  <button onclick="createGame()">Spiel erstellen</button>
  <input id="gameIdInput" placeholder="Game ID">
  <button onclick="joinGame()">Beitreten</button>
  <h3 id="link"></h3>
</div>

<div id="gameArea">
  <div class="player-stats" id="playerStats"></div>

  <div class="card" id="multipliers">
    <button onclick="setMultiplier(1)" id="m1" class="active">Single</button>
    <button onclick="setMultiplier(2)" id="m2">Double</button>
    <button onclick="setMultiplier(3)" id="m3">Triple</button>
  </div>

  <div class="card">
    <h3>Zahlen</h3>
    <div id="numbers"></div>
  </div>

  <div class="card">
    <h3>Aktueller Wurf</h3>
    <p id="throws"></p>
    <div class="checkout" id="checkout"></div>
    <button onclick="undo()">Undo</button>
    <button onclick="submitTurn()">Zug beenden</button>
  </div>
</div>

<div id="overlay" class="overlay">
  <div class="overlay-content">
    <h2>Spiel beendet</h2>
    <p id="winnerText"></p>
    <button onclick="closeOverlay()">Schließen</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

let gameId;
let players = [];
let currentPlayerIndex = 0;
let currentThrows = [];
let multiplier = 1;
let playerScores = {};
let totalPoints = {};
let totalDarts = {};
let lastThrows = {};
let playerSets = {};
let playerLegs = {};
let setsToWin = 3;
let legsToWin = 5;

// --- Zahlen Buttons erstellen inkl. 0 ---
const numbersDiv = document.getElementById("numbers");
for(let i=0;i<=20;i++){
  const btn=document.createElement("button");
  btn.innerText=i;
  btn.onclick=()=>addThrow(i);
  numbersDiv.appendChild(btn);
}
const bull=document.createElement("button");
bull.innerText="25";
bull.onclick=()=>addThrow(25);
numbersDiv.appendChild(bull);

function updatePlayerStats(){
  const container=document.getElementById("playerStats");
  container.innerHTML="";
  players.forEach((p,i)=>{
    const div=document.createElement("div");
    div.className="stats";
    const avg=(totalDarts[p.id]? (totalPoints[p.id]/totalDarts[p.id]*3).toFixed(2) : "0.00");
    const last=lastThrows[p.id]||[];
    const lastHTML=last.map(v=>`<p>${v}</p>`).join("");
    const sets=playerSets[p.id]||0;
    const legs=playerLegs[p.id]||0;
    const currentScore = playerScores[p.id]!==undefined? playerScores[p.id]:501;
    div.innerHTML=`<h3>${p.name}${i===currentPlayerIndex?' 🔹':''}</h3>
        <p class="score">Score: ${currentScore}</p>
        <p>Average: ${avg}</p>
        <div class="set-leg-display">Sets: ${sets} | Legs: ${legs}</div>
        <div class="last-throws">Letzte 5 Aufnahmen:<br>${lastHTML}</div>`;
    container.appendChild(div);
  });
}

// --- Check ob die Punkte ausmachbar sind ---
function isCheckoutPossible(throws, remaining){
  let total = 0;
  for(let t of throws){
    let pts = t.value * t.multiplier;
    if(t.value===25 && t.multiplier===2) pts = 50;
    total += pts;
  }
  let lastThrow = throws[throws.length-1];
  // Prüfe ob letzter Dart Double oder Bull ist
  if(remaining - total === 0){
    return (lastThrow.multiplier === 2 || (lastThrow.value===25 && lastThrow.multiplier>=1));
  }
  return false;
}

function addThrow(value){
  if(currentThrows.length>=3) return;
  const player = players[currentPlayerIndex];
  if(!player) return;

  let points = value*multiplier;
  if(value===25 && multiplier===2) points=50;
  const remaining = playerScores[player.id];

  // Prüfe auf Bust
  let tempThrows = [...currentThrows,{value,multiplier,points}];
  let tempTotal = tempThrows.reduce((sum,t)=>typeof t.points==="number"? sum+t.points:sum,0);
  if(tempTotal>remaining || remaining-tempTotal===1 || !isCheckoutPossible(tempThrows, remaining)){
    currentThrows.push({value,multiplier,points:"Bust"});
    endTurn();
    return;
  }

  currentThrows.push({value,multiplier,points});
  updateThrows();
  updateCheckout(remaining - points);
  setMultiplier(1);

  if(currentThrows.length===3) setTimeout(()=>submitTurn(),100);
}

function submitTurn(){
  const player = players[currentPlayerIndex];
  if(!player) return;
  const total = currentThrows.reduce((sum,t)=>typeof t.points==="number"? sum+t.points:sum,0);
  const remainingBefore = playerScores[player.id];

  let tempTotalThrows = currentThrows;
  if(total>remainingBefore || remainingBefore-total===1 || !isCheckoutPossible(tempTotalThrows, remainingBefore)){
    currentThrows=[];
    updateThrows();
    endTurn();
    return;
  }

  playerScores[player.id]-=total;
  totalPoints[player.id]=(totalPoints[player.id]||0)+total;
  totalDarts[player.id]=(totalDarts[player.id]||0)+currentThrows.filter(t=>typeof t.points==="number").length;

  if(!lastThrows[player.id]) lastThrows[player.id]=[];
  const sum=currentThrows.filter(t=>typeof t.points==="number").reduce((a,b)=>a+b,0);
  lastThrows[player.id].push(sum);
  if(lastThrows[player.id].length>5) lastThrows[player.id]=lastThrows[player.id].slice(-5);

  if(playerScores[player.id]===0){
    playerLegs[player.id]=(playerLegs[player.id]||0)+1;
    players.forEach(p=>playerScores[p.id]=501);

    if(playerLegs[player.id]>=legsToWin){
      playerSets[player.id]=(playerSets[player.id]||0)+1;
      players.forEach(p=>playerLegs[p.id]=0);

      if(playerSets[player.id]>=setsToWin){
        document.getElementById("winnerText").innerText=player.name+" hat das Spiel gewonnen!";
        document.getElementById("overlay").style.display="flex";
        return;
      }
    }
  }

  currentThrows=[];
  updateThrows();
  updatePlayerStats();
  endTurn();
}

function endTurn(){
  currentThrows=[];
  currentPlayerIndex=(currentPlayerIndex+1)%players.length;
  updatePlayerStats();
  updateThrows();
  document.getElementById("checkout").innerText="";
}

function updateThrows(){
  document.getElementById("throws").innerText=currentThrows.map(t=>typeof t.points==="number"? t.points: t.points).join(", ");
}

function undo(){ currentThrows.pop(); updateThrows(); }

function setMultiplier(m){
  multiplier=m;
  document.querySelectorAll("#m1,#m2,#m3").forEach(b=>b.classList.remove("active"));
  document.getElementById("m"+m).classList.add("active");
}

function updateCheckout(remaining){
  const table = {170:"T20 T20 Bull",167:"T20 T19 Bull",164:"T20 T18 Bull",161:"T20 T17 Bull",
                 160:"T20 T20 D20",158:"T20 T20 D19",157:"T20 T19 D20",156:"T20 T20 D18",155:"T20 T19 D19"};
  document.getElementById("checkout").innerText=table[remaining]||"";
}

// --- Neue Funktion: Game-ID generieren ---
function generateGameId() {
  return Math.floor(100000 + Math.random()*900000).toString(); // 6-stelliger Code
}

function createGame(){
  const name=document.getElementById("name").value;
  setsToWin=parseInt(document.getElementById("setsToWin").value)||3;
  legsToWin=parseInt(document.getElementById("legsToWin").value)||5;
  if(!name){alert("Bitte Namen eingeben!"); return;}
  gameId = generateGameId(); // automatisch Game-ID erstellen
  socket.emit("createGame",{name,setsToWin,legsToWin, gameId});
  document.getElementById("link").innerText=`Game-ID: ${gameId} | Link: ${window.location.origin}?game=${gameId}`;
  document.getElementById("setup").style.display="none";
  document.getElementById("gameArea").style.display="block";
}

function joinGame(){
  const name=document.getElementById("name").value;
  gameId=document.getElementById("gameIdInput").value;
  if(!gameId){alert("Bitte Game-ID eingeben!"); return;}
  socket.emit("joinGame",{gameId,name});
  document.getElementById("setup").style.display="none";
  document.getElementById("gameArea").style.display="block";
}

socket.on("gameUpdate",game=>{
  players=game.players;
  players.forEach(p=>playerScores[p.id]=game.scores[p.id]||501);
  players.forEach(p=>{
    playerSets[p.id]=game.sets?.[p.id]||0;
    playerLegs[p.id]=game.legs?.[p.id]||0;
  });
  updatePlayerStats();
});

socket.on("gameOver",({winner})=>{
  document.getElementById("winnerText").innerText=winner||"Unentschieden";
  document.getElementById("overlay").style.display="flex";
});

function closeOverlay(){document.getElementById("overlay").style.display="none";}
</script>
</body>
</html>
